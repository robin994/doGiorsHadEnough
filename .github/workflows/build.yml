name: Build

# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#concurrency
concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:  # Allows manual triggering
  push:
    branches:
      # choose your default branch
      - master
      - main
    paths-ignore:
      - '*.md'
      - '*.png'
      - '*.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@master
        with:
          ref: "builds"
          path: "builds"
      
      - name: Clean old builds
        run: rm $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Build Cloudstream gradle plugin
        # JitPack serve metadata corrotti per com.github.recloudstream:gradle:master-SNAPSHOT
        # (errore "master-aster-SNAPSHOT"). Buildiamo il plugin da sorgente e lo pubblichiamo
        # in mavenLocal come com.lagradost.cloudstream3:gradle:local-SNAPSHOT.
        run: |
          git clone https://github.com/recloudstream/gradle.git "$GITHUB_WORKSPACE/cs-gradle"
          cd "$GITHUB_WORKSPACE/cs-gradle"
          git checkout 32895aedb6366f5075cb99bbd2e6ce0a7cac325d
          chmod +x gradlew
          ./gradlew publishToMavenLocal

      - name: Access Secrets
        env:
          TMDB_API: ${{ secrets.TMDB_API }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          ILCORSAROVIOLAVERCEL: ${{ secrets.ILCORSAROVIOLAVERCEL }}
        run: |
          cd $GITHUB_WORKSPACE/src
          echo TMDB_API=$TMDB_API >> secrets.properties
          echo SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID >> secrets.properties
          echo ILCORSAROVIOLAVERCEL=$ILCORSAROVIOLAVERCEL >> secrets.properties

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          export BUILD_COMPLETED_AT_ROME="$(TZ=Europe/Rome date +"%d/%m/%Y %H:%M")"
          ./gradlew make makePluginsJson
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Update repo.json
        run: |
          cat > "$GITHUB_WORKSPACE/builds/repo.json" <<EOF
          {
            "name": "${{ github.repository_owner }}'s Had Enough",
            "iconUrl": "https://raw.githubusercontent.com/${{ github.repository }}/master/repo_icon.png",
            "description": "Repository with mostly italian providers and some international one",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/${{ github.repository }}/builds/plugins.json"
            ]
          }
          EOF

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0   # do not error if nothing to commit
          git push --force

      - name: Purge jsDelivr cache
        # jsDelivr tiene in cache i file di un branch ~12h: senza purge chi usa il
        # proxy jsDelivr in CloudStream vede plugins.json nuovo ma .cs3 vecchio
        # (o viceversa) -> "hash mismatch" all'installazione.
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          base="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@builds"
          for f in repo.json plugins.json *.cs3; do
            echo "purge $f"
            curl -s -m 30 "$base/$f" > /dev/null || true
          done
